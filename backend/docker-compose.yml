version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: tesis_postgres
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin
    ports:
      - "5433:5432"
    volumes:
      - ../db/Esquema.sql:/docker-entrypoint-initdb.d/01_esquema.sql
    restart: always
